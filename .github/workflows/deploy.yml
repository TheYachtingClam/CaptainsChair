# Checks every pull request, and deploys main to Fly after the same checks pass (plans/bug-pipeline.md).
# After a deploy, the bug reports named by "Fixes-Bug: <id>" lines in the pushed commits are marked resolved.
#
# Repository secrets (Settings > Secrets and variables > Actions):
#   FLY_API_TOKEN   fly tokens create deploy -a captains-chair-wild-bush-4325
#   CC_BUG_TOKEN    the server's BUG_API_TOKEN (fly secrets set BUG_API_TOKEN=...)
# Without FLY_API_TOKEN the deploy job is skipped with a notice; without CC_BUG_TOKEN no report is resolved.

name: Test and deploy

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.event_name == 'push' && 'deploy' || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  APP: captains-chair-wild-bush-4325
  CC_URL: https://captains-chair-wild-bush-4325.fly.dev

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: client/package-lock.json
      - name: Server tests
        run: |
          (cd server && uv sync --python 3.12 --quiet)
          scripts/start.sh --test
      - name: Client build
        working-directory: client
        run: npm ci && npm run build

  deploy:
    needs: test
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
      CC_BUG_TOKEN: ${{ secrets.CC_BUG_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Check for the Fly token
        id: ready
        run: |
          if [ -z "$FLY_API_TOKEN" ]; then
            echo "::notice::FLY_API_TOKEN is not set, so main was not deployed. See plans/bug-pipeline.md."
            echo "go=false" >> "$GITHUB_OUTPUT"
          else
            echo "go=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: superfly/flyctl-actions/setup-flyctl@master
        if: steps.ready.outputs.go == 'true'
      - name: Deploy
        if: steps.ready.outputs.go == 'true'
        run: flyctl deploy --remote-only --app "$APP"
      - name: Wait for the site
        if: steps.ready.outputs.go == 'true'
        run: |
          for i in $(seq 1 30); do
            if curl -fsS "$CC_URL/api/health" > /dev/null; then echo "The site is up."; exit 0; fi
            sleep 10
          done
          echo "::error::$CC_URL/api/health did not answer after the deploy."
          exit 1
      - name: Resolve the fixed bug reports
        if: steps.ready.outputs.go == 'true'
        env:
          BEFORE: ${{ github.event.before }}
        run: |
          if echo "$BEFORE" | grep -qE '^0+$' || [ -z "$BEFORE" ] || ! git cat-file -e "$BEFORE" 2>/dev/null; then
            range="HEAD~1..HEAD"
          else
            range="$BEFORE..HEAD"
          fi
          ids=$(git log --format=%B "$range" | sed -nE 's/^Fixes-Bug:[[:space:]]*([0-9a-fA-F-]+).*/\1/p' | sort -u)
          if [ -z "$ids" ]; then echo "No Fixes-Bug lines in $range."; exit 0; fi
          if [ -z "$CC_BUG_TOKEN" ]; then
            echo "::warning::CC_BUG_TOKEN is not set; mark these resolved on the Admin page: $ids"
            exit 0
          fi
          python3 scripts/bugs.py resolve $ids
