# Tutorial: Learn to play with Picard (requirements/24-tutorials.md §2, plans/tutorial.md).
# Every expected move was played through in the engine with this setup; tests/test_tutorial.py replays it.
# Text: `say` is the step (two or three sentences); `more` is the optional detail behind the coach's More link.
# **bold** marks game terms; [Action], [Dilithium], [Latinum], [Glory], [Research], [Influence], [Military] and
# [Away Team] are drawn as icons.
id: picard-basics
title: Learn to play with Picard
summary: Play a practice game with Jean-Luc Picard while a coach explains each part of the game.

setup:
  mode: cadet
  box: core
  deck: picard
  board: basic
  seed: 7
  stack:
    hand: [1PIC19, 1PIC22, 1PIC17, 1PIC24, 1PIC16]   # Utilize, Set a Course, Recruit, Will Riker, Diplomacy
    draw: [1PIC15, 1PIC20, 1PIC23, 1PIC21, 1PIC18]   # Analyze, Red Alert, Worf, Farpoint Station, Strange New Worlds
    market: {Ally: 1ALL13}                           # Tholians face up
    market_decks: {Ally: [1ALL02, 1ALL01, 1ALL07]}   # then Bolians, Arin'sen, Halkan Council
    neutral: [1LOC19, 1LOC12, 1LOC20]                # Verex III, Indri VIII, Xahea

steps:
  # ---------------------------------------------------------------- Welcome
  - id: welcome
    say: |
      Welcome aboard, Captain. This is a practice game with **Jean-Luc Picard**. I'll explain each part as it comes up
      and, for the first three turns, tell you what to do.
    more: |
      Tap **More** whenever you want the detail behind a step, and **?** for **How cards work**: where each kind of
      ability works, the icons, and the game's words.
    next: button
  - id: goal
    say: |
      You win with **Victory Points** (VP): from **Glory** you collect, the VP printed on your cards, and bonuses from
      your Captain and Locations. This practice game lasts 11 turns; a real game ends when the **Stardate** cards run
      out of Glory.
    more: |
      There is one other way a game ends, **the Burn**: if the Incident deck runs out, the game stops at once and the
      player with fewer Incidents wins. In a practice game the Burn means you lose, so return Incidents when you can.
    show: zone:stardate
    next: button
  - id: resources
    say: |
      Your resources: [Dilithium] **Dilithium** and [Latinum] **Latinum** pay for cards and effects; [Glory] **Glory**
      is worth 1 VP each at the end. You start with one of each.
    more: |
      When you pay, 1 Glory can stand in for 1 Latinum or for 2 Dilithium, with no change given. Each Glory you spend
      is a VP lost, so keep it for when you really need it.
    show: zone:resources
    next: button
  - id: captain
    say: |
      This is your **Captain**. Picard has a **Reaction**: an ability that triggers by itself when something happens,
      and you choose whether to use it. His: after you gain an **Ally**, discard a card to gain 1 Glory and beam that
      Ally onto a Ship.
    more: |
      At the end he also scores 1 VP for each Ally you own. Reactions, like other abilities on a blue strip, work only
      while the card is in play on your table: see **How cards work**.
    show: zone:captain
    next: button
  - id: board
    say: |
      Your **Crew board** shows Picard's mission and three **Specialty tracks**: [Research] Research, [Influence]
      Influence and [Military] Military. Cards move your markers: "gain 1 Research" moves Research one space.
    more: |
      Why climb? Some cards need a track value ("Requires Military 3"). Picard's mission needs two tracks at 4. And
      the marked spaces multiply the VP of your **Focus** cards at the end, once you've completed a mission.
      **Utilize** can move a track once for each matching Skill icon you have in play.
    show: zone:tracks
    next: button
  - id: ship
    say: |
      Your Ship, the **U.S.S. Enterprise-D**, starts in your **Fleet Area**. Ships fly to Locations and carry cards
      beamed aboard them.
    show: card:1PIC02
    next: button
  - id: hand
    say: |
      These five cards are your **hand**, from your 10-card starting deck. Each turn you play cards from it; at the
      end of the turn you draw back up to five.
    show: zone:hand
    next: button
  - id: turn
    say: |
      A turn has four steps: **Resupply**, **Control**, **Actions** and **Clean-up**. You're in the Action Step now,
      with three **actions** to spend. What a card can do depends on where it is: see **How cards work**.
    show: zone:resources
    next: button

  # ---------------------------------------------------------------- Turn 1
  - id: utilize
    say: |
      A card with the [Action] **Action** icon on an effect costs one of your three actions to play it. Play
      **Utilize** and choose its first effect to gain Dilithium.
    more: |
      **PLAY** effects happen when you play the card from your hand. Blue strips (**ACTIVATION**, **REACTION**, **PASSIVE**) work only while the card is on your table: your Captain,
      Fleet Area, Location Area or Duty Officer slot.
    show: card:1PIC19
    expect: play:1PIC19:0
  - id: free-plays
    say: |
      **Set a Course**'s second effect has no [Action] icon, so it doesn't use an action: it's **free**. It draws a
      card, then you discard one, and lets you warp your Ships. Play it.
    show: card:1PIC22
    expect: play:1PIC22:1
  - id: discard-analyze
    say: You drew **Analyze**. Discard it; you won't need it this turn.
    show: question
    expect: 1PIC15
  - id: warp-ship
    say: |
      Now warp your Ship. **Warping** moves it to a Location: one of yours or one of the three neutral ones in the
      **Neutral Zone**.
    show: question
    expect: 1PIC02
  - id: warp-where
    say: |
      Send the Enterprise-D to **Indri VIII**. A Ship at a neutral Location counts toward claiming it, but we'll claim a
      different one and keep this Ship safe.
    more: |
      Ships also guard a Location: an opponent can't send Away Teams to a Location where you have more Ships than they
      do. You'll use that against a real opponent.
    show: zone:neutral
    expect: 1LOC12
  - id: undo
    say: |
      Made a mistake? **Undo** takes back your last move, as long as it revealed nothing new. A move that draws or turns
      over a card can't be undone: it shows a 🔒 and asks you first.
    show: button:undo
    next: button
  - id: market
    say: |
      This is the **Market**: four decks with one card face up on each. **Gaining** a card puts it into your deck, but
      every card gained makes your deck bigger and slower to get through, so gain cards you'll be glad to draw.
    show: zone:market
    next: button
  - id: recruit
    say: |
      Play **Recruit**'s second effect: take an **Incident** to gain an Ally. Incidents are bad cards, −2 VP each at the
      end; some cards return them to the Incident deck, and you'll see one next turn.
    show: card:1PIC17
    expect: play:1PIC17:1
  - id: gain-tholians
    say: Gain **Tholians**, the face-up Ally.
    show: card:1ALL13
    expect: market:Ally
  - id: where-gained
    say: |
      A gained card goes on top of your deck or into your **Discard pile**. Put Tholians in your Discard pile; Picard is
      about to move it.
    show: question
    expect: discard
  - id: reaction
    say: |
      You gained an Ally, so Picard's **Reaction** is ready. Use it: you'll discard a card to gain 1 Glory and may beam
      Tholians onto a Ship.
    show: zone:captain
    expect: use:0
  - id: reaction-cost
    say: |
      Discard the **Incident** you just took: it's the card you least want in your hand. (It stays in your deck,
      though; only returning it gets rid of it.)
    show: question
    expect: pick:Incident
  - id: beam-tholians
    say: |
      **Beam** Tholians to the Enterprise-D. Cards beamed to a Ship travel with it, and Picard's mission needs three
      Allies on one Ship.
    show: card:1PIC02
    expect: 1PIC02
  - id: diplomacy
    say: |
      Last action: play **Diplomacy**'s second effect. It gains another Ally and puts Diplomacy in your **Captain's
      Log**.
    show: card:1PIC16
    expect: play:1PIC16:1
  - id: gain-bolians
    say: Gain **Bolians**, the new face-up Ally.
    show: card:1ALL02
    expect: market:Ally
  - id: bolians-top
    say: |
      Put Bolians **on top of your deck**: you'll draw it next turn. (Picard's Reaction isn't offered: using it
      **exhausted** him, turned him sideways, and he refreshes at the end of your turn.)
    show: question
    expect: top
  - id: log
    say: |
      Diplomacy is now in your **Captain's Log**. Logged cards leave your deck for good, but they still score their VP
      at the end.
    more: |
      Logging is also a way to thin your deck: fewer weak cards means you draw your good ones more often.
    show: zone:log
    next: button
  - id: end-turn-1
    say: Will Riker stays in your hand for next turn. Tap **End Turn** to go to Clean-up.
    show: button:end-turn
    expect: end
  - id: wipe
    say: |
      In this practice game, Clean-up first clears one Market card. Wipe **Arin'sen**: it needs 3 Military, which you
      don't have.
    more: |
      Only practice games wipe a card here. In a real game the Market is wiped when a Stardate card runs out.
    show: zone:market:Ally
    expect: wipe:Ally
  - id: glory-on-market
    say: |
      Then you place 1 **Glory** on a Market card. Whoever gains that card later takes the Glory with it. Put it on
      **Halkan Council**.
    show: zone:market:Ally
    expect: glory:Ally
  - id: draw-up
    say: |
      Last, you may discard cards from your hand, then you **draw up** to five. Discarding is usually good: you draw
      fresh cards and get through your deck sooner. Keep **Will Riker**: we have a plan for him next turn. Tap **Done**.
    more: |
      Keep a card only when you know how you'll use it next turn. Riker's PLAY will take two cards back from your
      Discard pile and send an Away Team.
    show: question
    expect: done

  # ---------------------------------------------------------------- Turn 2
  - id: turn-2-start
    say: |
      Every turn starts with **Resupply** and **Control**. You have no RESUPPLY abilities in play or secured Locations
      yet, so they passed by and you're straight into your actions.
    next: button
  - id: worf
    say: |
      To claim a neutral Location, you first **secure** it: 3 or more of your tokens there (Away Teams and Ships), and
      at least 2 more than your opponent. Play **Worf**: he sends 2 [Away Team] **Away Teams** to a neutral Location.
    more: |
      At the start of your next turn, in the Control step, you may take control of one secured Location. Here, the
      practice opponent always has 1 Away Team at every neutral Location (shown under each one), so 3 of yours beat it
      by 2.
    show: card:1PIC23
    expect: play:1PIC23:0
  - id: worf-where
    say: Send them to **Verex III**. Its reward when you take it is 1 Glory.
    show: card:1LOC19
    expect: 1LOC19
  - id: riker
    say: |
      Worf also discarded the top card of your deck. Now play **Will Riker**: he takes 2 cards back from your Discard
      pile and can send another Away Team.
    show: card:1PIC24
    expect: play:1PIC24:0
  - id: riker-utilize
    say: Take back **Utilize**…
    show: question
    expect: 1PIC19
  - id: riker-recruit
    say: …and **Recruit**. You'll play both again next turn.
    show: question
    expect: 1PIC17
  - id: riker-send
    say: Spend 1 Dilithium to send an Away Team.
    show: question
    expect: "yes"
  - id: riker-where
    say: |
      Send it to **Verex III**. That makes 3 Away Teams there: it's **secured**. Next turn you can take control of it.
    show: card:1LOC19
    expect: 1LOC19
  - id: red-alert
    say: |
      **Red Alert** is one of Picard's own Incidents, and its effect returns it to the Incident deck. Play it to get rid
      of it.
    show: card:1PIC20
    expect: play:1PIC20:0
  - id: red-alert-cost
    say: Its cost is putting a card on top of your deck. Put **Bolians** there; you'll draw it again.
    show: question
    expect: 1ALL02
  - id: staging
    say: |
      Cards you play wait in your **Staging Area** until Clean-up. Red Alert can promote a Person from there: promote
      **Will Riker** to **Duty Officer**.
    show: zone:staging
    expect: 1PIC24
  - id: duty-officer
    say: |
      A **Duty Officer** stays in play: Riker's RESUPPLY gains you 1 Latinum at the start of every turn, and his
      Activations can each be used once a turn. You can have only one Duty Officer at a time.
    show: zone:duty
    next: button
  - id: end-turn-2
    say: You've used all three actions. **End Turn**.
    show: button:end-turn
    expect: end
  - id: wipe-2
    say: Wipe **Mirok** this time.
    show: zone:market:Person
    expect: wipe:Person
  - id: glory-2
    say: Put the Glory on **Halkan Council** again; it now carries 2.
    show: zone:market:Ally
    expect: glory:Ally
  - id: draw-up-2
    say: |
      This time keep all three cards: **Farpoint Station** becomes a Location you control, and **Utilize** and
      **Recruit** pay off once it's out. Tap **Done**.
    more: |
      Keeping three is unusual: normally you'd discard more to see fresh cards. These three each have a job next turn,
      which is the test for keeping a card.
    show: question
    expect: done

  # ---------------------------------------------------------------- Turn 3
  - id: cycle
    say: |
      Drawing up, your deck ran out: your Discard pile was shuffled into a new deck, and the top card of your
      **Reserve** went on it. Each reshuffle **enlists** a Reserve card like this.
    more: |
      Your cards come from four places. Your **starting deck**: the 10 cards you began with. The **Market**: cards you
      gain. Your **Reserve**: four of Picard's better cards, one joining your deck at each reshuffle. Your **Development
      pile**: his best cards; once the Reserve is empty, each reshuffle lets you enlist one by paying its cost. Getting
      through your deck quickly gets you there sooner.
    show: zone:reserve
    next: button
  - id: resupply
    say: |
      Your turn began with **Resupply**: Will Riker discarded the top card of your deck and gained you 1 Latinum.
      Then comes **Control**.
    show: zone:duty
    next: button
  - id: take-control
    say: |
      Verex III is secured, so take control of it. Taking a Location **dismisses** every Ship there: it goes to your
      Discard pile with every card beamed to it. We kept the Enterprise-D away to protect the Allies on it, which
      Picard's mission needs.
    more: |
      Taking control: the opponent gains 1 Glory for each of their tokens there; all Away Teams return to their
      Captains; all Ships there are dismissed; the Location joins your Location Area and its **CONTROL** effect
      resolves; a new Location fills the Neutral Zone. You can take one Location per turn.
    show: card:1LOC19
    expect: take:1LOC19
  - id: control-reward
    say: |
      Verex III is now yours, and its **CONTROL** effect gave you 1 Glory. Your Away Teams came back to your Captain to
      use again.
    show: zone:locations
    next: button
  - id: farpoint
    say: |
      **Farpoint Station** is a Location from your own deck. Play it to take control of it; its CONTROL gives 1
      [Research] **Research**.
    show: card:1PIC21
    expect: play:1PIC21:0
  - id: utilize-2
    say: |
      Play **Utilize** again. It gives 2 extra Dilithium for each Location you control: 5 this time.
    show: card:1PIC19
    expect: play:1PIC19:0
  - id: recruit-2
    say: Play **Recruit** again to take an Incident and gain an Ally.
    show: card:1PIC17
    expect: play:1PIC17:1
  - id: gain-halkan
    say: Gain **Halkan Council**. Its 2 Glory comes with it.
    show: card:1ALL07
    expect: market:Ally
  - id: halkan-where
    say: Into the Discard pile again.
    show: question
    expect: discard
  - id: reaction-2
    say: Use Picard's Reaction…
    show: zone:captain
    expect: use:0
  - id: reaction-cost-2
    say: …discard the Incident…
    show: question
    expect: pick:Incident
  - id: beam-halkan
    say: …and beam Halkan Council to the Enterprise-D. That's two Allies aboard.
    show: card:1PIC02
    expect: 1PIC02
  - id: shuttlecraft
    say: |
      You drew **Type 7 Shuttlecraft**, the Reserve card that joined your deck. Its second effect has no [Action] icon,
      so it's free: play it to gain 1 Dilithium and beam a card to a Ship.
    show: card:1PIC14
    expect: play:1PIC14:1
  - id: beam-bolians
    say: |
      Choose **beam**: Bolians goes from your hand to the Enterprise-D. Three Allies on one Ship is the first half of
      Picard's mission.
    show: question
    expect: beam
  - id: mission
    say: |
      **Peace Negotiations** is Picard's mission, the goal his deck is built around. Claim it once you have 3 Allies on
      one Ship and two tracks at 4: you gain 4 Dilithium and draw 4 cards.
    more: |
      Completing a mission also makes your **Focus** cards score at the end: each track's best multiplier times its
      Focus cards. So climbing the tracks pays twice. When the goal is met, a mission button appears on your Crew
      board during your Action Step.
    show: zone:tracks
    next: button
  - id: end-turn-3
    say: That's all your actions. **End Turn**.
    show: button:end-turn
    expect: end
  - id: wipe-3
    say: Wipe any Market card you like.
    show: zone:market
    expect: [wipe:Person, wipe:Cargo, wipe:Ship, wipe:Ally]
  - id: glory-3
    say: Place the Glory on any Market card.
    show: zone:market
    expect: [glory:Person, glory:Cargo, glory:Ship, glory:Ally]
  - id: draw-up-3
    say: |
      Discard what you have no plan for, then tap **Done**. From now on, the choices are yours.
    show: question
    expect: done
  - id: free-play
    say: |
      You know the basics now, Captain. The rest of the game is yours: I'll add a tip when something new happens. Aim
      for 70 VP or more.
    next: button

tips:
  - id: encounter
    when: {question: encounter}
    say: |
      **Encounters** are among the strongest cards in the game: one-off effects you take into your hand.
  - id: strange-new-worlds
    when: {playable: 1PIC18}
    say: |
      **Strange New Worlds** needs a Location you control with an Away Team and a Ship there. It logs that Location
      for 1 Research, and you take an **Encounter**: one of the strongest cards in the game.
    show: card:1PIC18
  - id: develop
    when: {question: develop}
    say: |
      Your Reserve is empty, so this reshuffle lets you **enlist a Development** instead: pay its cost to put one of
      Picard's stronger cards on top of your new deck.
    show: zone:development
  - id: tracks-high
    when: {track_at_least: 4}
    say: |
      A Specialty track at 4 or more counts toward Peace Negotiations. Higher marks on a track also multiply the VP of
      your **Focus** cards at the end, once you've completed a mission.
    show: zone:tracks
  - id: mission-ready
    when: {question: mission}
    say: |
      **Peace Negotiations** is complete! Claim it from the mission button on your Crew board: gain 4 Dilithium, draw 4
      cards, and you may junk a Market card.
    show: zone:tracks
  - id: incident-in-hand
    when: {event: take_incident}
    say: |
      An Incident in hand: −2 VP at the end, and the more Incidents players take, the closer the **Burn** comes.
      Return it when a card lets you.
    show: zone:incident
  - id: stardate
    when: {moment: stardate-empties}
    say: |
      The first **Stardate** card ran out of Glory. Next turn the Market and every Neutral Zone Location without your
      tokens are wiped, and the second Stardate starts.
    show: zone:stardate
  - id: last-turn
    when: {moment: last-turn}
    say: |
      This is your **last turn**. Spend everything: leftover Dilithium and Latinum score nothing.
  - id: final-scoring
    when: {moment: final-scoring}
    say: |
      **Final scoring** adds up: your Glory; your tokens on neutral Locations; **ENDGAME** abilities (Picard scores 1 VP
      per Ally, and some Locations score too); the VP printed on every card you own, including your Log (Incidents
      −2); and, if you completed a mission, your **Focus** cards times each track's best multiplier. Reserve and
      Development cards don't count.
  - id: next
    when: {moment: game-over}
    say: |
      Well done, Captain! Next, try a game **against a Bot**: a real opponent with its own deck, who attacks and claims
      Locations too.
    link: {label: Play against a Bot, to: /new}
