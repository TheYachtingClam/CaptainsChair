# Generated by scripts/build_content.py from resources/scans. Do not edit by hand.
crews:
- deck: burnham
  set: base_game
  name: Burnham Automated Command cards
  special_rule: During Clean-up Step, instead of adding [Glory], remove 1 [Glory] from the Stardate card and add 2 [Dilithium]
    to one Market card instead. At the end of the game, the Bot scores 1 [VP] per [Dilithium] (instead of the usual 1 [VP]
    per 2 [Dilithium]).
  sides:
  - side: traits
    image: burnham-traits
    rows:
    - number: 1
      matches:
      - Surprise
      text: Resolve this card's Surprise operation.
      steps:
      - 1. Resolve the card's SURPRISE (Bot only) operation instead of any row.
      uses: []
      attack: false
      undoable: true
    - number: 2
      matches:
      - Creature
      text: Gain 1 [Military]. Gain a Person / Cargo. If a Ship is in Bot Discard pile, deploy it; it explores.
      steps:
      - 1. Gain 1 [Military].
      - 2. Gain a Person / Cargo.
      - 3. If a Ship is in Bot Discard pile, deploy it; it explores.
      uses:
      - GAIN_SPECIALTY
      - GAIN_CARD
      - DEPLOY
      - EXPLORE
      attack: false
      undoable: false
    - number: 3
      matches:
      - Scientist
      text: Log the top card of the Bot deck. Take an Incident. Gain 1 [Research]. Gain an Ally.
      steps:
      - 1. Log the top card of the Bot deck.
      - 2. Take an Incident.
      - 3. Gain 1 [Research].
      - 4. Gain an Ally.
      uses:
      - LOG
      - TAKE_INCIDENT
      - GAIN_SPECIALTY
      - GAIN_CARD
      attack: false
      undoable: false
    - number: 4
      matches:
      - Anomaly
      text: If a Person is in Bot Discard pile, promote it to Duty Officer. If this card is a Ship, deploy it; it explores.
        Otherwise, gain 2 [Glory].
      steps:
      - 1. If a Person is in Bot Discard pile, promote it to Duty Officer.
      - 2. If this card is a Ship, deploy it; it explores.
      - 3. Otherwise, gain 2 [Glory].
      uses:
      - PROMOTE
      - DEPLOY
      - EXPLORE
      - GAIN_RESOURCE
      attack: false
      undoable: true
    - number: 5
      matches:
      - Kelpien
      text: If able, gain a Kelpien. Otherwise, gain the card in the Market with the most [Dilithium] > most [Glory]. If this
        card is a Person, promote it to Duty Officer.
      steps:
      - 1. If able, gain a Kelpien.
      - 2. Otherwise, gain the card in the Market with the most [Dilithium] > most [Glory].
      - 3. If this card is a Person, promote it to Duty Officer.
      uses:
      - GAIN_CARD
      - PROMOTE
      attack: false
      undoable: false
  - side: no_duty_officer
